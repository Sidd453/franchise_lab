<!-- QUICK INQUIRY MODAL -->
<div id="modal" class="hidden fixed inset-0 z-[60] items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm">
  <div class="relative w-full max-w-lg rounded-3xl bg-white p-8 shadow-2xl">
    <button data-close-modal class="absolute top-4 right-4 w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200" aria-label="Close">✕</button>
    <h3 class="text-2xl font-extrabold mb-5">Quick <span class="text-gradient">Inquiry</span></h3>
    <form class="grid gap-4 sm:grid-cols-2">
      <input class="field" placeholder="First Name" required>
      <input class="field" placeholder="Last Name" required>
      <input class="field" type="tel" placeholder="Mobile Number" required>
      <input class="field" type="email" placeholder="Email" required>
      <input class="field" placeholder="Enter State">
      <input class="field" placeholder="Enter City">
      <button type="submit" class="btn-primary sm:col-span-2">Send</button>
    </form>
  </div>
</div>
